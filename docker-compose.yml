services:
  ollama:
    image: ollama/ollama:latest
    container_name: slm-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Uncomment to give Ollama a GPU (NVIDIA Container Toolkit required).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: slm-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull qwen2.5:7b
        ollama pull nomic-embed-text
        echo "models ready"
    restart: "no"

  harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: slm-harness:local
    container_name: slm-harness
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATA_DIR: /app/data
      DASHBOARD_PORT: 8787
    volumes:
      - harness-data:/app/data
    # By default the container does nothing; run a script with:
    #   docker compose run --rm harness bun run demo
    command: ["bun", "run", "smoke", "--", "--skip-llm"]

  dashboard:
    image: slm-harness:local
    container_name: slm-dashboard
    depends_on:
      - harness
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATA_DIR: /app/data
      DASHBOARD_PORT: 8787
    volumes:
      - harness-data:/app/data
    ports:
      - "8787:8787"
    command: ["bun", "run", "dashboard"]
    restart: unless-stopped

volumes:
  ollama-models:
  harness-data:
